# improvdsp settings (written by the control page; safe to edit by hand)

# --- hardware (read at start-up only)
device = hw:CODEC
sample_rate = 48000
period = 128
prefill = 2
input_channel = 0
rt_priority = 70
web_port = 8080
web_bind = 0.0.0.0
record_dir = /var/lib/improvdsp/recordings
record_segment_min = 10

# --- live settings
gain_db              = 0   # Master gain (dB). Your 'fader'.
ceiling_db           = 12   # Hard limit on gain + AGC boost (dB). Ring point - 6
hpf_hz               = 120   # High-pass corner (Hz), 24 dB/oct
agc_on               = 1   # Speech-gated automatic gain control
agc_ref_dbfs         = -38   # Speech level that gets 0 dB of AGC (dBFS)
agc_max_boost_db     = 6   # Most the AGC may raise a quiet performer (dB)
agc_max_cut_db       = 12   # Most the AGC may lower a loud performer (dB)
agc_rise_dbps        = 6   # AGC rise speed while speech is present (dB/s)
agc_fall_dbps        = 20   # AGC fall speed (dB/s)
speech_margin_db     = 8   # Speech must be this far above noise floor (dB)
exp_on               = 1   # Downward expander (turns down the room when nobody talks)
exp_thresh_dbfs      = -65   # Expander threshold floor (dBFS)
exp_margin_db        = 6   # Expander threshold above measured noise floor (dB)
exp_ratio            = 2   # Expander ratio
exp_range_db         = 10   # Max expander attenuation (dB)
shift_on             = 1   # Frequency shifter
shift_hz             = 4   # Frequency shift (Hz). 3-5 typical, keep under 12
afs_on               = 1   # Automatic feedback notches
afs_slots            = 8   # Number of automatic notch filters
afs_width_oct        = 0.1   # Notch width (octaves)
afs_init_db          = -6   # Depth of a new notch (dB)
afs_step_db          = -3   # Extra depth when feedback recurs (dB)
afs_max_db           = -12   # Deepest automatic notch (dB)
afs_min_hz           = 150   # Lowest frequency the detector watches (Hz)
afs_max_hz           = 8000   # Highest frequency the detector watches (Hz)
afs_min_level_dbfs   = -55   # Ignore peaks quieter than this (dBFS)
afs_papr_db          = 10   # Peak-to-average threshold (dB)
afs_phpr_db          = 30   # Peak-to-harmonic threshold (dB)
afs_pnpr_db          = 12   # Peak-to-neighbour threshold (dB)
afs_persist          = 7   # Frames a peak must persist (1 frame = 10.7 ms)
afs_interlock_db     = 3   # Drop gain this much per feedback event (dB)
afs_interlock_max_db = 9   # Max total interlock drop (dB)
afs_hold_s           = 30   # Hold interlock drop this long after last event (s)
afs_recover_dbps     = 0.1   # Interlock recovery speed after hold (dB/s)
limiter_dbfs         = -3   # Output peak limiter (dBFS)
front_on             = 1   # Front speaker output (left)
front_trim_db        = 0   # Front speaker trim (dB)
front_delay_ms       = 0   # Front speaker delay (ms)
fill_on              = 1   # Fill speaker output (right)
fill_trim_db         = 0   # Fill speaker trim (dB)
fill_delay_ms        = 0   # Fill delay (ms) = its distance from the stage in ft / 1.13

# --- fixed notches from ring-out: hz  gain_db  q
